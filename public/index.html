<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- 🔒 Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#ff7f50" />
    <meta name="description" content="Angadi - Your Smart Marketplace for Everything" />
    <meta name="keywords" content="angadi, ecommerce, marketplace, online store, react, amplify" />
    <meta name="author" content="Angadi Team" />

    <!-- 🧠 SEO -->
    <meta property="og:title" content="Angadi – Your Smart Marketplace" />
    <meta property="og:description" content="Buy, sell, and explore your favorite products at Angadi" />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta property="og:url" content="https://your-angadi-site.com" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 🔖 Title & Favicon -->
    <title>Angadi – Your Marketplace</title>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- 📦 Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />

    <!-- 🎞️ Lottie Animations -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js" defer></script>

    <!-- 🖌️ Custom Styles -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background-color: #fff;
        color: #333;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }

      #root {
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }

      #root.visible {
        opacity: 1;
      }

      /* Loader */
      #loader {
        position: fixed;
        inset: 0;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .brand-glow {
        font-size: 1.1rem;
        color: #ff7f50;
        margin-top: 1rem;
        animation: fadeInUp 1s ease forwards;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>

  <body>
    <noscript>
      <strong>We're sorry but Angadi doesn't work properly without JavaScript enabled.</strong>
    </noscript>

    <!-- 🔄 Custom Lottie Loader -->
    <div id="loader" role="status" aria-label="Loading content">
      <lottie-player
        src="https://assets10.lottiefiles.com/packages/lf20_sSF6EG.json"
        background="transparent"
        speed="1"
        loop
        autoplay
        style="width: 160px; height: 160px"
      ></lottie-player>
      <div class="brand-glow">Getting your store ready...</div>
    </div>

    <!-- 🚀 React Root -->
    <div id="root" style="display: none;"></div>

    <!-- 🎯 Loader Transition -->
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('loader');
        const root = document.getElementById('root');
        if (loader) loader.style.display = 'none';
        if (root) {
          root.style.display = 'block';
          setTimeout(() => root.classList.add('visible'), 50);
        }
      });
    </script>

    <!-- Bootstrap Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
